# cargo-audit configuration for brig-id/server-forest
#
# RUSTSEC-2026-0543: `chrono` is unmaintained. It is in Cargo.lock as an optional
# dependency of `serde_with` (brought by webauthn-rs 0.6), behind a feature nothing
# enables: it is not compiled (`cargo tree --target all -i chrono` prints nothing, and
# cargo-deny, which reads what is compiled and not the lock file, does not see it).
# The only exception left, and one of the tool, not of the code: it goes when the shared
# workflow lets cargo-deny judge unmaintained crates (brig-id/.github).
[advisories]
ignore = ["RUSTSEC-2026-0543"]
