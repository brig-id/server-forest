[package]
name = "forest"
# The version of a release is its tag: the release build writes it here before
# compiling (scripts/set-version.sh). Any other build says 0.0.0.
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.94"

[dependencies]
# The server every edition runs (core): forest only describes itself, and
# turns on the store's PostgreSQL driver, which the two other editions do not
# carry. The core at a commit of its main, which Cargo.lock holds: `cargo
# update -p brigid-server` follows a newer one.
brigid-server = { git = "https://github.com/brig-id/core", branch = "main", package = "brigid-server", features = ["postgres"] }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }

# A static (musl) build carries its own OpenSSL: the system's is not there to
# link to. OpenSSL is reached only by the attestation code of webauthn-rs,
# which brig·id never runs (attestation "none").
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
brigid-ui-embed = { git = "https://github.com/brig-id/core", branch = "main", package = "brigid-ui-embed" }

[dev-dependencies]
# The tests fill a single-node database through the store, as the commands
# of seedling and grove do, and take its backup.
brigid-store = { git = "https://github.com/brig-id/core", branch = "main", package = "brigid-store" }
# A PostgreSQL schema and a role per test.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3"
serde_json = "1"
url = "2"
# Reads the payload of an ID token.
base64ct = { version = "1", features = ["alloc"] }
# The tests drive real nodes over HTTP, through a whole passkey ceremony with
# a software passkey. The same versions as brig-id/core, which holds the
# server side of the ceremony: these move when the core moves.
reqwest = { version = "0.13", features = ["json"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
