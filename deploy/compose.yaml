# brig·id forest — several nodes on one PostgreSQL database, on one machine.
#
#   cp deploy/forest.env.example deploy/forest.env     # then edit it
#   deploy/prepare.sh                                  # the secrets, once
#   docker compose -f deploy/compose.yaml --env-file deploy/forest.env up -d
#   docker compose -f deploy/compose.yaml --env-file deploy/forest.env logs init
#
# The last command shows the setup link of the first administrator.
#
# What runs:
# - postgres:  the database. Everything that lasts, and everything the nodes
#              share, is in it: back it up with PostgreSQL's own tools. In a
#              company it is the database you already run: remove this
#              service and write its address in the two `database_url_*`
#              secrets (docs/install.md).
# - init:      `forest init`, once before the nodes and before each update:
#              the schema, the secret of the identifiers, the first signing
#              key, the setup link. It connects as the role that owns the
#              schema; the nodes connect as another, which cannot change it.
# - forest-1, forest-2: the nodes. The same image, no disk, no state: either
#              answers any request, and one can stop in the middle of a
#              sign-in without that sign-in being lost.
# - proxy:     what stands in front: it holds the certificate, spreads the
#              requests over the nodes that say they are ready, and replaces
#              X-Forwarded-For (the nodes key their rate limits on it).
#
# One machine is still one machine: this file shows forest whole and serves a
# server that must be updated without interruption. No single point of
# failure needs the nodes on several machines, and a database with a standby
# (docs/install.md).
#
# The secrets are files mounted as they are: Compose (outside a swarm)
# ignores `uid` and `mode`, so the files themselves belong to the user that
# reads them (65532 for forest, 999 for postgres). deploy/prepare.sh does it.
#
# Image: a release, pinned by digest in FOREST_IMAGE
# (ghcr.io/brig-id/forest:vX.Y.Z@sha256:…), or one built from this repository
# (`docker build -t brigid/forest:dev .`).

secrets:
  brigid_master_key:
    file: ./secrets/master_key
  database_url_owner:
    file: ./secrets/database_url_owner
  database_url_node:
    file: ./secrets/database_url_node
  owner_password:
    file: ./secrets/owner_password
  node_password:
    file: ./secrets/node_password

volumes:
  postgres-data:
  proxy-data:
  proxy-config:

x-forest: &forest
  image: ${FOREST_IMAGE:-brigid/forest:dev}
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  environment: &settings
    RUST_LOG: "brigid_api=info,brigid_server=info,warn"
    BRIGID_MASTER_KEY_FILE: /run/secrets/brigid_master_key
    BRIGID_SERVER__DOMAIN: "${BRIGID_DOMAIN:?BRIGID_DOMAIN must be set}"
    BRIGID_SERVER__PUBLIC_URL: "https://${BRIGID_DOMAIN}"
    BRIGID_SERVER__HOST: "0.0.0.0"
    BRIGID_SERVER__PORT: "8080"
    BRIGID_SERVER__METRICS_PORT: "9100"
    BRIGID_DATABASE__URL_FILE: /run/secrets/database_url_node
    # The database is on this machine's private network, which nothing else
    # reads: its connections carry no TLS. With a database elsewhere, remove
    # this line and let the address verify the certificate (the default).
    BRIGID_DATABASE__ALLOW_UNVERIFIED: "true"
    BRIGID_SECURITY__TRUST_FORWARDED_FOR: "true"

x-node: &node
  <<: *forest
  restart: unless-stopped
  secrets:
    - brigid_master_key
    - database_url_node
  depends_on:
    init:
      condition: service_completed_successfully
  # Longer than the time a node keeps answering once told to stop (5 s),
  # plus the time it gives the requests it has (10 s).
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "/forest", "healthcheck"]
    interval: 10s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  postgres:
    # postgres:18, multi-arch index digest.
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    restart: unless-stopped
    environment:
      POSTGRES_USER: forest_owner
      POSTGRES_DB: forest
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    secrets:
      - owner_password
      - node_password
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the role of the nodes when the database is created.
      - ./postgres/10-node-role.sh:/docker-entrypoint-initdb.d/10-node-role.sh:ro
    healthcheck:
      # Over the network, not the local socket: while the image creates the
      # database it runs a first server that listens on the socket only, and
      # `init` would start before the real one accepts its connection.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U forest_owner -d forest"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    <<: *forest
    command: ["init", "--grant", "forest_node"]
    restart: "no"
    environment:
      <<: *settings
      BRIGID_DATABASE__URL_FILE: /run/secrets/database_url_owner
    secrets:
      - brigid_master_key
      - database_url_owner
    depends_on:
      postgres:
        condition: service_healthy

  forest-1: *node
  forest-2: *node

  proxy:
    # caddy:2.10.2-alpine, multi-arch index digest.
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      BRIGID_DOMAIN: "${BRIGID_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - forest-1
      - forest-2
